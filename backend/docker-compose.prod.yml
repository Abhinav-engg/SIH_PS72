version: "3.9"

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: stormsight_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stormsight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stormsight_secret}
      POSTGRES_DB: ${POSTGRES_DB:-stormsight}
    ports:
      - "5432:5432"
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stormsight -d stormsight"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stormsight_prod_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - prod_redis_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stormsight_prod_api
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://stormsight:stormsight_secret@db:5432/stormsight
      DATABASE_SYNC_URL: postgresql+psycopg2://stormsight:stormsight_secret@db:5432/stormsight
      REDIS_URL: redis://redis:6379/0
      PYTHONPATH: /ml:/app
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ../data:/data
      - ../ml/checkpoints:/ml/checkpoints
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  prod_postgres_data:
  prod_redis_data:
